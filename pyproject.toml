[project]
name = "jsonui-render-mcp"
version = "0.1.0"
description = "MCP server that draws Minecraft Bedrock JSON UI screens"
requires-python = ">=3.10"
dependencies = ["mcp", "pillow"]

[project.scripts]
jsonui-render-mcp = "server:main"

[tool.setuptools]
packages = ["jsonui"]
py-modules = ["server"]
